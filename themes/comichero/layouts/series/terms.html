{{ define "main" }}
<div class="container section">
  <header class="page-header comic-panel comic-panel--hero comic-panel--lined page-shell-panel">
    <h1 class="page-title sfx-pop">{{ i18n "all_series" | default "All series" }}</h1>
    <p class="lead">{{ i18n "series_terms_intro" | default "Jump into a storyline — each card is one series." }}</p>
  </header>
  <ul class="comic-grid" role="list">
    {{ range $term := .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ $term.Page.RelPermalink }}" class="comic-card comic-card--section">
        <h2 class="comic-card__title">{{ $term.Page.Title }}</h2>
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
