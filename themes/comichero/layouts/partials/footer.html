<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__copy"><span>{{ site.Params.comichero.footerText | default site.Title }}</span><span class="site-footer__year">© {{ now.Year }}</span></p>
    <nav class="footer-nav" aria-label="Footer">
      <a href="{{ "/" | relURL }}index.xml">RSS</a>
      <a href="{{ "/" | relURL }}index.json">JSON Feed</a>
      {{ with site.Menus.footer }}{{ range . }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}{{ end }}
    </nav>
  </div>
</footer>
