{{ if or .Paginator.HasPrev .Paginator.HasNext }}
<nav class="pagination comic-panel" aria-label="Pagination">
  {{ if .Paginator.HasPrev }}
  <a class="btn btn--ghost" href="{{ .Paginator.Prev.URL }}">← Prev</a>
  {{ else }}
  <span class="btn btn--ghost is-disabled" aria-disabled="true">← Prev</span>
  {{ end }}
  <span class="pagination__status">{{ .Paginator.PageNumber }} / {{ .Paginator.TotalPages }}</span>
  {{ if .Paginator.HasNext }}
  <a class="btn btn--ghost" href="{{ .Paginator.Next.URL }}">Next →</a>
  {{ else }}
  <span class="btn btn--ghost is-disabled" aria-disabled="true">Next →</span>
  {{ end }}
</nav>
{{ end }}
