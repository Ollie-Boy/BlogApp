{{ define "main" }}
<div class="container section">
  <article class="about-page comic-panel comic-panel--hero comic-panel--lined page-shell-panel">
    <header class="page-header about-page__header">
      <h1 class="page-title sfx-pop">{{ .Title }}</h1>
      {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    </header>
    <div class="prose article-content about-page__content">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
