{{ define "main" }}
<article class="container section article comic-panel comic-panel--article comic-panel--lined">
  <header class="article-header">
    <p class="article-kicker">{{ .Section | humanize }}</p>
    <h1 class="article-title sfx-pop">{{ .Title }}</h1>
    <div class="article-meta">
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      {{ with .Params.tags }}
      <span class="article-meta__tags">
        {{ range . }}<span class="tag">{{ . }}</span>{{ end }}
      </span>
      {{ end }}
    </div>
    {{ with .Params.image }}
    <figure class="article-hero">
      <img src="{{ . | relURL }}" alt="{{ $.Title }}" loading="eager" width="1200" height="630">
    </figure>
    {{ end }}
  </header>
  <div class="prose article-content">
    {{ .Content }}
  </div>
  {{ partial "article-nav.html" . }}
</article>
{{ end }}
