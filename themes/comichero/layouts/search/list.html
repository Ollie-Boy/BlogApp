{{ define "main" }}
<div class="container section">
  <header class="page-header comic-panel comic-panel--hero comic-panel--lined page-shell-panel">
    <h1 class="page-title sfx-pop">{{ .Title }}</h1>
    {{ with .Content }}<div class="prose lead">{{ . }}</div>{{ end }}
  </header>
  <section class="comic-panel search-page">
    <form class="search-page__form" data-search-form role="search">
      <label class="visually-hidden" for="search-query">Search</label>
      <input id="search-query" class="search-page__input" type="search" name="q" placeholder="{{ site.Params.comichero.searchPlaceholder | default "Search posts, docs, and series..." }}" autocomplete="off">
      <button class="btn btn--primary" type="submit">Search</button>
    </form>
    <p class="search-page__meta" data-search-meta></p>
    <ul class="search-page__results" data-search-results></ul>
  </section>
</div>
{{ end }}

{{ define "scripts" }}
<script defer>
  window.addEventListener("DOMContentLoaded", function () {
    var params = new URLSearchParams(window.location.search);
    var initialQuery = (params.get("q") || "").trim();
    var input = document.getElementById("search-query");
    var form = document.querySelector("[data-search-form]");
    var meta = document.querySelector("[data-search-meta]");
    var results = document.querySelector("[data-search-results]");

    if (input && initialQuery) {
      input.value = initialQuery;
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function setMeta(text) {
      if (meta) meta.textContent = text;
    }

    function splitTokens(query) {
      return String(query || "")
        .trim()
        .toLowerCase()
        .split(/\s+/)
        .filter(Boolean);
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, tokens) {
      var out = escapeHtml(text || "");
      if (!tokens.length) return out;
      tokens.forEach(function (token) {
        var re = new RegExp("(" + escapeRegExp(token) + ")", "gi");
        out = out.replace(re, "<mark>$1</mark>");
      });
      return out;
    }

    function excerptAroundMatch(text, tokens) {
      var source = String(text || "");
      if (!source) return "";
      var lower = source.toLowerCase();
      var idx = -1;
      tokens.forEach(function (token) {
        var hit = lower.indexOf(token);
        if (hit !== -1 && (idx === -1 || hit < idx)) idx = hit;
      });
      if (idx === -1) idx = 0;
      var start = Math.max(0, idx - 46);
      var end = Math.min(source.length, idx + 120);
      var slice = source.slice(start, end).trim();
      if (start > 0) slice = "… " + slice;
      if (end < source.length) slice = slice + " …";
      return slice;
    }

    function renderResults(items, query) {
      if (!results) return;
      results.innerHTML = "";
      var tokens = splitTokens(query);
      if (!tokens.length) {
        setMeta("");
        return;
      }
      if (!items.length) {
        setMeta("No matches found.");
        return;
      }
      setMeta("Found " + items.length + " result(s).");
      items.slice(0, 40).forEach(function (item) {
        var body = item.body_text || "";
        var excerpt = excerptAroundMatch(body, tokens);
        var li = document.createElement("li");
        li.className = "search-page__item";
        li.innerHTML =
          '<a href="' +
          escapeHtml(item.url) +
          '" class="search-page__link">' +
          '<strong>' +
          highlight(item.title || "", tokens) +
          "</strong>" +
          '<span>' +
          highlight(excerpt || item.section || "", tokens) +
          "</span>" +
          "</a>";
        results.appendChild(li);
      });
    }

    fetch("{{ "/index.json" | relURL }}")
      .then(function (res) { return res.json(); })
      .then(function (json) {
        var items = Array.isArray(json.items) ? json.items : [];
        function runSearch(query) {
          var tokens = splitTokens(query);
          var q = query.trim();
          var filtered = items.filter(function (item) {
            if (!tokens.length) return false;
            var title = String(item.title || "").toLowerCase();
            var body = String(item.body_text || "").toLowerCase();
            return tokens.every(function (token) {
              return title.indexOf(token) !== -1 || body.indexOf(token) !== -1;
            });
          });
          renderResults(filtered, q);
        }
        if (form && input) {
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            var q = input.value.trim();
            runSearch(q);
            var nextUrl = q ? ("/search/?q=" + encodeURIComponent(q)) : "/search/";
            window.history.replaceState({}, "", nextUrl);
          });
        }
        if (initialQuery) {
          runSearch(initialQuery);
        }
      })
      .catch(function () {
        setMeta("Search index failed to load.");
      });
  });
</script>
<style>
  .search-page__form {
    display: flex;
    gap: 0.65rem;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .search-page__input {
    flex: 1 1 18rem;
    min-width: 16rem;
    border: var(--stroke) solid var(--line);
    padding: 0.55rem 0.75rem;
    font: inherit;
    background: var(--panel);
    color: var(--ink);
  }
  .search-page__meta {
    margin: 0.5rem 0 1rem;
    font-weight: 700;
  }
  .search-page__results {
    list-style: none;
    margin: 1rem 0 0;
    padding: 0;
    display: grid;
    gap: 0.65rem;
  }
  .search-page__item {
    border: var(--stroke) solid var(--line);
    background: var(--panel);
    box-shadow: 4px 4px 0 var(--line);
  }
  .search-page__link {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding: 0.7rem 0.85rem;
    text-decoration: none;
    color: inherit;
  }
  .search-page__link span {
    color: var(--muted);
  }
  .search-page mark {
    background: color-mix(in srgb, #ffeb3b 70%, var(--panel));
    color: inherit;
    padding: 0 0.15em;
  }
</style>
{{ end }}
