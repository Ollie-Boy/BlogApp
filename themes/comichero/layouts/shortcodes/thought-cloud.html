{{- $from := .Get "from" | default "Inner voice" -}}
{{- $class := .Get "class" -}}
<aside class="comic-thought-cloud {{ $class }}" role="note" aria-label="Thought">
  <p class="comic-thought-cloud__label">{{ $from }}</p>
  <div class="comic-thought-cloud__bubble">{{ .Inner | markdownify }}</div>
</aside>
