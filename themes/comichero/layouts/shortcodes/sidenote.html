{{- $title := .Get "title" | default "Note" -}}
{{- $class := .Get "class" -}}
<aside class="comic-aside comic-aside--right {{ $class }}" role="note" aria-label="{{ $title }}">
  <div class="comic-aside__inner">
    <p class="comic-aside__title">{{ $title }}</p>
    <div class="comic-aside__body">{{ .Inner | markdownify }}</div>
  </div>
</aside>
