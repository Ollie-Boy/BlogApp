baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "ComicHero Demo"
theme = "comichero"
themesDir = "../themes"

[params]
  description = "Demo site: blog, portfolio, and docs in one comic-book layout."
  og_image = "/images/placeholder-comic.svg"

[taxonomies]
  tag = "tags"
  series = "series"

[params.comichero]
  defaultTheme = "light"
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap"
  useLocalFonts = true
  heroTitle = "Stories, shots & specs"
  heroSubtitle = "One loud theme for blogs, portfolios, and documentation — hard shadows and motion to spare."
  heroSfx = "KAPOW!"
  latestHeading = "Fresh off the press"
  footerText = "ComicHero demo — MIT theme."
  homeTypes = ["blog", "portfolio"]

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[markup.highlight]
  style = "monokai"
  lineNos = false
  noClasses = false
  guessSyntax = true

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 10

[[menus.main]]
  name = "Portfolio"
  url = "/portfolio/"
  weight = 20

[[menus.main]]
  name = "Docs"
  url = "/docs/"
  weight = 30

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 40

[[menus.main]]
  name = "Series"
  url = "/series/"
  weight = 35

[[menus.footer]]
  name = "Privacy"
  url = "/about/#privacy"

[[menus.footer]]
  name = "Colophon"
  url = "/about/#colophon"

[[menus.hero]]
  name = "Open docs"
  url = "/docs/getting-started/"
  weight = 10

[[menus.hero]]
  name = "View portfolio"
  url = "/portfolio/"
  weight = 20
