baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "wind in the sky"
theme = "comichero"
themesDir = "../themes"

[params]
  description = "Demo site: blog, docs, and series in one comic-book layout."
  og_image = "/images/furry-god-thumb.svg"

[taxonomies]
  tag = "tags"
  series = "series"

[params.comichero]
  defaultTheme = "auto"
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap"
  useLocalFonts = true
  heroTitle = "wind in the sky"
  heroSubtitle = "A personal notebook of code, ideas, and small experiments drifting forward one post at a time."
  heroSfx = "KAPOW!"
  latestHeading = "Fresh off the press"
  footerText = "Write light. Ship often. Keep moving with the wind."
  homeTypes = ["blog"]
  githubUser = "Ollie-Boy"
  searchPlaceholder = "Search posts, docs, and series..."
  defaultThumbnail = "/images/furry-god-thumb.svg"
  homeCardLimit = 6
  blogTagLimit = 8

  [params.comichero.labels]
  lastUpdated = "Last updated:"
  allTags = "All"
  sectionsAria = "Sections"
  paginationAria = "Pagination"
  prev = "← Prev"
  next = "Next →"
  tocTitle = "On this page"
  tocEmpty = "Add headings to show a table of contents."

  [params.comichero.shortcodeDefaults]
  panelTitle = ""

  [params.comichero.ui]
  heroTitle = "wind in the sky"
  heroSubtitle = "A personal notebook of code, ideas, and small experiments drifting forward one post at a time."
  heroSfx = "KAPOW!"
  latestHeading = "Fresh off the press"

    [params.comichero.ui.labels]
    lastUpdated = "Last updated:"
    allTags = "All"
    sectionsAria = "Sections"
    paginationAria = "Pagination"
    prev = "← Prev"
    next = "Next →"

  [params.comichero.layout]
  homeTypes = ["blog"]
  homeCardLimit = 6
  blogTagLimit = 8

  [params.comichero.media]
  defaultThumbnail = "/images/furry-god-thumb.svg"

  [params.comichero.sectionIntro]
  blog = "Browse the latest posts — this is where I share coding notes, life updates, and new experiments."
  docs = "Guides, setup notes, and references for building and customizing the site."
  series = "Follow story arcs and issue order in one place."
  archives = "Browse posts by date to quickly revisit older entries."

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[markup.highlight]
  style = "monokai"
  lineNos = false
  noClasses = false
  guessSyntax = true

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 10

[[menus.main]]
  name = "Docs"
  url = "/docs/"
  weight = 20

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 30

[[menus.main]]
  name = "Series"
  url = "/series/"
  weight = 25

[[menus.main]]
  name = "Archives"
  url = "/archives/"
  weight = 26

[[menus.main]]
  name = "Search"
  url = "/search/"
  weight = 27

[[menus.hero]]
  name = "Open docs"
  url = "/docs/getting-started/"
  weight = 10

[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML", "RSS", "JSON"]
