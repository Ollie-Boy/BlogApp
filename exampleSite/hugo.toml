baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "wind in the sky"
theme = "comichero"
themesDir = "../themes"

[params]
  description = "Demo site: blog, docs, and series in one comic-book layout."
  og_image = "/images/cover-blog-wind.svg"

[taxonomies]
  tag = "tags"
  series = "series"

[params.comichero]
  defaultTheme = "light"
  googleFontsUrl = "https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap"
  useLocalFonts = true
  heroTitle = "wind in the sky"
  heroSubtitle = "A personal notebook of code, ideas, and small experiments drifting forward one post at a time."
  heroSfx = "KAPOW!"
  latestHeading = "Fresh off the press"
  footerText = "Write light. Ship often. Keep moving with the wind."
  homeTypes = ["blog"]
  githubUser = "Ollie-Boy"

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[markup.highlight]
  style = "monokai"
  lineNos = false
  noClasses = false
  guessSyntax = true

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 10

[[menus.main]]
  name = "Docs"
  url = "/docs/"
  weight = 20

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 30

[[menus.main]]
  name = "Series"
  url = "/series/"
  weight = 25

[[menus.hero]]
  name = "Open docs"
  url = "/docs/getting-started/"
  weight = 10

[pagination]
  pagerSize = 12
